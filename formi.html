<!DOCTYPE html>
<html>
<head>
    <title>Form Data Siswa</title>
</head>

<body>

<table border="1" width="500" align="center" style="border-collapse: collapse;">
    <tr>
        <td style="padding: 10px;">

            <h2 align="center">FORM DATA SISWA</h2>

            <hr>

            <form>

                <table border="0" style="border-collapse: collapse;">

                    <tr>
                        <td valign="top">Username</td>
                        <td valign="top">:</td>
                        <td>
                            <input type="text" name="username">
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">Password</td>
                        <td valign="top">:</td>
                        <td>
                            <input type="password" name="password">
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">Nama Lengkap</td>
                        <td valign="top">:</td>
                        <td>
                            <input type="text" name="nama">
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">No. Handphone</td>
                        <td valign="top">:</td>
                        <td>
                            <input type="text" name="nohp">
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">E-Mail</td>
                        <td valign="top">:</td>
                        <td>
                            <input type="email" name="email">
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">Jenis Kelamin</td>
                        <td valign="top">:</td>
                        <td>
                            <input type="radio" name="jk" value="pria"> Pria
                            <input type="radio" name="jk" value="wanita"> Wanita
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">Hobi</td>
                        <td valign="top">:</td>
                        <td valign="top">
                            <input type="checkbox" name="hobi" value="menyanyi"> Menyanyi <br>
                            <input type="checkbox" name="hobi" value="olahraga"> Olahraga <br>
                            <input type="checkbox" name="hobi" value="membaca"> Membaca
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">Kompetensi Keahlian</td>
                        <td valign="top">:</td>
                        <td>
                            <select name="kompetensi">
                                <option>Rekayasa Perangkat Lunak</option>
                                <option>Bisnis Digital</option>
                                <option>Layanan Perbankan</option>
                                <option>Akuntansi</option>
                                <option>Menejement Perkantoran</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">Alamat</td>
                        <td valign="top">:</td>
                        <td>
                            <textarea name="alamat" rows="5" cols="25"></textarea>
                        </td>
                    </tr>

                </table>

                <hr>

                <input type="button" value="Kirim">
                <input type="reset" value="Reset">

            </form>

        </td>
    </tr>
</table><br>

        <a href="index.html">Back Home</a>

</body>
</html>
